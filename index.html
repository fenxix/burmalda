<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Бурмалда</title>

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#7c5c6c">
<meta name="background-color" content="#ded0ee">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Бурмалда">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192-1.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512-2.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
  :root {
    --primary: #7c5c6c;
    --primary-dark: #624754;
    --bg-color: #ded0ee;
    --card-bg: #ffffff;
    --text-main: #2b2b2b;
    --text-muted: #757575;
    --accent: #b089a4;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: 'Nunito', sans-serif;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    background-color: var(--bg-color);
    color: var(--text-main);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    overflow: hidden;
  }

  .app-container {
    width: 100%;
    max-width: 430px;
    min-height: 100dvh;
    background-color: var(--bg-color);
    display: flex;
    flex-direction: column;
    position: relative;
    overflow: hidden;
    margin: 0 auto;
  }

  .screen {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: none;
    flex-direction: column;
    padding: 24px;
    background-color: var(--bg-color);
    opacity: 0;
    transition: opacity 0.3s ease;
  }

  .screen.active {
    display: flex;
    opacity: 1;
    z-index: 10;
  }

  /* WELCOME SCREEN STYLES */
  #screen-welcome {
    justify-content: space-between;
    align-items: center;
    text-align: center;
    padding: 40px 24px;
  }

  .welcome-top {
    flex-grow: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    width: 100%;
  }

  .welcome-logo-container {
    width: 160px;
    height: 160px;
    background: var(--card-bg);
    border-radius: 40px;
    display: flex;
    justify-content: center;
    align-items: center;
    box-shadow: 0 12px 30px rgba(124, 92, 108, 0.15);
    margin-bottom: 28px;
    animation: floatLogo 3s ease-in-out infinite;
  }

  .welcome-logo-container img {
    width: 110px;
    height: 110px;
    object-fit: contain;
  }

  @keyframes floatLogo {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
  }

  .welcome-title {
    font-family: 'Quicksand', sans-serif;
    font-size: 36px;
    font-weight: 700;
    color: var(--primary);
    margin-bottom: 12px;
    letter-spacing: 0.5px;
  }

  .welcome-subtitle {
    font-size: 16px;
    color: var(--text-muted);
    max-width: 280px;
    line-height: 1.5;
    font-weight: 600;
  }

  .welcome-footer {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .btn {
    width: 100%;
    padding: 16px 24px;
    border-radius: 20px;
    font-size: 16px;
    font-weight: 700;
    border: none;
    cursor: pointer;
    transition: all 0.2s ease;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
  }

  .btn-primary {
    background-color: var(--primary);
    color: #ffffff;
    box-shadow: 0 8px 20px rgba(124, 92, 108, 0.3);
  }

  .btn-primary:active {
    background-color: var(--primary-dark);
    transform: scale(0.98);
  }

  .btn-secondary {
    background-color: rgba(255, 255, 255, 0.6);
    color: var(--primary);
  }

  .btn-secondary:active {
    background-color: rgba(255, 255, 255, 0.9);
    transform: scale(0.98);
  }
</style>
</head>
<body>

<div class="app-container">
  
  <!-- WELCOME SCREEN -->
  <div id="screen-welcome" class="screen active">
    <div class="welcome-top">
      <div class="welcome-logo-container">
        <img src="penguin-no-bg.png" alt="Бурмалда Лого">
      </div>
      <h1 class="welcome-title">Бурмалда</h1>
      <p class="welcome-subtitle">Удобный помощник для дворовых игр и ведения счета</p>
    </div>

    <div class="welcome-footer">
      <button class="btn btn-primary" onclick="goTo('screen-nickname')">Начать игру</button>
      <button class="btn btn-secondary" onclick="goTo('screen-home')">Войти</button>
    </div>
  </div>

  <div id="screen-nickname" class="screen">
    <h2>Экран ввода никнейма</h2>
    <button class="btn btn-primary" onclick="goTo('screen-welcome')">Назад</button>
  </div>

  <div id="screen-home" class="screen">
    <h2>Главный экран</h2>
    <button class="btn btn-primary" onclick="goTo('screen-welcome')">Выйти</button>
  </div>

</div>

<script>
  function goTo(screenId) {
    document.querySelectorAll('.screen').forEach(screen => {
      screen.classList.remove('active');
    });
    const target = document.getElementById(screenId);
    if (target) {
      target.classList.add('active');
    }
  }
</script>

</body>
</html>
