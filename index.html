<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Бурмалда</title>

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#7c5c6c">
<meta name="background-color" content="#ded0ee">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Бурмалда">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192-1.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512-2.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
  :root {
    --primary: #624754;
    --primary-dark: #4d3641;
    --bg-color: #ded0ee;
    --text-main: #4a3b45;
    --text-muted: #7a6874;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: 'Nunito', sans-serif;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    background-color: var(--bg-color);
    color: var(--text-main);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    overflow: hidden;
  }

  .app-container {
    width: 100%;
    max-width: 430px;
    min-height: 100dvh;
    background-color: var(--bg-color);
    display: flex;
    flex-direction: column;
    position: relative;
    overflow: hidden;
    margin: 0 auto;
  }

  .screen {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: none;
    flex-direction: column;
    padding: 32px 24px;
    background-color: var(--bg-color);
    opacity: 0;
    transition: opacity 0.3s ease;
  }

  .screen.active {
    display: flex;
    opacity: 1;
    z-index: 10;
  }

  /* WELCOME SCREEN STYLES (MATCHING REFERENCE) */
  #screen-welcome {
    justify-content: space-between;
    align-items: center;
    text-align: center;
    padding: 48px 24px 36px 24px;
  }

  .welcome-header {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
  }

  .welcome-title {
    font-family: 'Quicksand', sans-serif;
    font-size: 38px;
    font-weight: 700;
    color: var(--primary);
    letter-spacing: 0.5px;
    margin-bottom: 4px;
  }

  .welcome-heart {
    font-size: 14px;
    color: #624754;
    margin-bottom: 10px;
  }

  .welcome-subtitle {
    font-size: 15px;
    color: var(--text-muted);
    font-weight: 600;
    line-height: 1.4;
  }

  .welcome-illustration {
    width: 100%;
    max-width: 280px;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-grow: 1;
    margin: 10px 0;
  }

  .welcome-illustration img {
    width: 100%;
    height: auto;
    object-fit: contain;
  }

  .welcome-footer {
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }

  .btn {
    width: 100%;
    padding: 16px 24px;
    border-radius: 28px;
    font-size: 16px;
    font-weight: 700;
    border: none;
    cursor: pointer;
    transition: all 0.2s ease;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
  }

  .btn-primary {
    background-color: var(--primary);
    color: #ffffff;
    box-shadow: 0 6px 18px rgba(98, 71, 84, 0.2);
  }

  .btn-primary:active {
    background-color: var(--primary-dark);
    transform: scale(0.98);
  }

  .btn-link {
    background: none;
    border: none;
    color: var(--text-muted);
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    padding: 4px;
    transition: color 0.2s ease;
  }

  .btn-link:active {
    color: var(--primary);
  }
</style>
</head>
<body>

<div class="app-container">
  
  <!-- WELCOME SCREEN -->
  <div id="screen-welcome" class="screen active">
    <div class="welcome-header">
      <h1 class="welcome-title">Бурмалда</h1>
      <div class="welcome-heart">❤️</div>
      <p class="welcome-subtitle">Маленькие радости<br>для больших дней</p>
    </div>

    <div class="welcome-illustration">
      <img src="penguin-no-bg.png" alt="Бурмалда Иллюстрация">
    </div>

    <div class="welcome-footer">
      <button class="btn btn-primary" onclick="goTo('screen-nickname')">Начать &rarr;</button>
      <button class="btn-link" onclick="goTo('screen-home')">У меня уже есть аккаунт</button>
    </div>
  </div>

  <div id="screen-nickname" class="screen">
    <h2>Экран ввода никнейма</h2>
    <button class="btn btn-primary" onclick="goTo('screen-welcome')" style="margin-top: 20px;">Назад</button>
  </div>

  <div id="screen-home" class="screen">
    <h2>Главный экран</h2>
    <button class="btn btn-primary" onclick="goTo('screen-welcome')" style="margin-top: 20px;">Выйти</button>
  </div>

</div>

<script>
  function goTo(screenId) {
    document.querySelectorAll('.screen').forEach(screen => {
      screen.classList.remove('active');
    });
    const target = document.getElementById(screenId);
    if (target) {
      target.classList.add('active');
    }
  }
</script>

</body>
</html>
